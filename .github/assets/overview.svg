<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="sell.me.at at a glance: You are the seller, Your own signing key, Counted downloads, Buyers never stranded">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">You are the</tspan><tspan x="44" dy="22">seller</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Buyers pay on your</tspan><tspan x="44" dy="21">own Stripe account.</tspan><tspan x="44" dy="21">There is no platform</tspan><tspan x="44" dy="21">balance in between,</tspan><tspan x="44" dy="21">so nothing can hold a</tspan><tspan x="44" dy="21">payout.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="256" dy="0">Your own</tspan><tspan x="256" dy="22">signing key</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Each seller gets an</tspan><tspan x="256" dy="21">Ed25519 keypair, and</tspan><tspan x="256" dy="21">license keys are</tspan><tspan x="256" dy="21">signed with it, never</tspan><tspan x="256" dy="21">with a shared</tspan><tspan x="256" dy="21">platform key.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="468" dy="0">Counted</tspan><tspan x="468" dy="22">downloads</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">Each purchase carries</tspan><tspan x="468" dy="21">a download allowance,</tspan><tspan x="468" dy="21">links are</tspan><tspan x="468" dy="21">short-lived, and</tspan><tspan x="468" dy="21">every request is</tspan><tspan x="468" dy="21">logged, refusals too.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="680" dy="0">Buyers never</tspan><tspan x="680" dy="22">stranded</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="680" dy="0">Refunds and disputes</tspan><tspan x="680" dy="21">revoke access.</tspan><tspan x="680" dy="21">Closing a storefront</tspan><tspan x="680" dy="21">suspends it, so</tspan><tspan x="680" dy="21">buyers keep what they</tspan><tspan x="680" dy="21">bought.</tspan></text>
</svg>
